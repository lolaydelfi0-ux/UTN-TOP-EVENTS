<!DOCTYPE html>
<html lang="en">
  <head>
    <title>¿Qué podes festejar?</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <!--
      Need a visual blank slate?
      Remove all code in `styles.css`!
    -->
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <header>
        <div>
          <div>
            <img id="logo" src="img/logonosotras.png" alt="fotologo">
          </div>
        </div>
      </header>
    <nav>
      <a href="/index.html">¿Quienes somos?</a>
      <a href="/festejos.html" >¿Qué podes festejar?</a>
      <a href="/ideas.html" >¿Qué viene incluido?</a>
      <a href="/locales.html">Nuestras sucursales</a>
      <a href="/encuesta.html" aria-current="page">Reserva acá</a>
    </nav>
    <main>
     
        <h2>Reserva tu fecha</h2>
        <p>Ingrese sus datos para realizar la reserva del salon </p>
        <section>
          <div id="formulario">
            <h2>Tus datos</h2>
            <form action="#">
              <label for="formnombre">Nombre</label>
              <input type="text" name="formnombre" maxlength="30" minlength="5" required placeholder="Ingrese su nombre" >
              
              <label for="fromapellido">Apellido</label>
              <input type="texto" name="fromapellido" id="fromapellido" maxlength="30" minlength="5" required placeholder="Ingrese su apellido">
  
              <input id="fromedad" required type="number" placeholder="Ingrese su edad">
  
              <input id="fromclave" required type="password" placeholder="Ingrese su contraseña">
  
              <input type="email" placeholder="correopp@dom.com">
  
              <input type="radio" id="fromf" name="fromsexo" value="Femenino">
              <label for="fem">Femenino</label>
              <input type="radio" id="fromm" name="fromsexo" value="Masculino">
              <label for="masc">Masculino</label>
              <input type="radio" id="fromn" name="fromsexo" value="nodecirlo">
              <label for="noinf">Prefiero no decirlo</label><br> <br>
              
              <label for="ubicacion">Seleccione la ubicación</label> <br>
              <select name="ubicacion" id="frombi">
                <option value="plateaa">Avellaneda</option>
                <option value="plateam">Pilar</option>
                <option value="plateab">La Plata</option>
                <option value="popular">San isidro</option>
                <option value="palco">Quilmes</option>
              </select>
              <input type="date">
      
              <label for="festejar">Seleccione que queres festejar</label> <br>
              <input type="radio" id="quince" name="fiequince" value="fiequince">
              <label for="quince">Quince</label>
              <input type="radio" id="cincuenta" name="cincuenta" value="cincuenta">
              <label for="cincuenta">Cincuenta</label>
              <input type="radio" id="casamiento" name="casamiento" value="casamiento">
              <label for="casamiento">Casamiento</label>
              <input type="radio" id="otro" name="otro" value="otro">
              <label for="otro">Otro</label>
              
              <input type="submit">
  
  
    
            </form>
          </div>
        </section>
      
    </main>
  </body>
</html>
